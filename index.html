<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cortex Gaming</title>
<style>
:root{--bg:#14171c;--fg:#e8e6d9;--accent:#b5b02a;--muted:#9a9a8c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:64px 16px}
h1{font-size:2rem;letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px}
p.lead{color:var(--muted);margin:0 0 40px}
.card{border:1px solid #2a2f37;border-radius:12px;padding:20px;margin-bottom:16px}
.card h2{margin:0 0 6px;font-size:1.2rem;color:var(--accent)}
.card p{margin:0 0 12px}
a{color:var(--accent)}
footer{margin-top:48px;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
<h1>Cortex Gaming</h1>
<p class="lead">Small games for your phone.</p>
<div class="card">
<h2>Neke The Snake</h2>
<p>Classic pixel snake on a retro LCD screen. Swipe or play with number keys.</p>
<p><a href="https://play.google.com/store/apps/details?id=app.nekethesnake">Get it on Google Play</a></p>
</div>
<footer>
<a href="https://sites.google.com/view/neke-the-snake">Privacy policy</a>
</footer>
</main>
</body>
</html>
